[project]
name = "jharkhand-innovation-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20",
  "python-dotenv>=1,<2",
  "google-genai>=1,<3",
  "google-auth>=2,<3",
]

[dependency-groups]
dev = ["httpx>=0.28,<1"]
