[project]
name = "jharkhand-innovation-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20",
  "python-dotenv>=1,<2",
  "google-genai>=1,<3",
  "google-auth>=2,<3",
  "google-cloud-storage>=2.18,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 400
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "RUF", "PIE"]
ignore = [
  "B008",    # FastAPI declares every dependency as a parameter default; that is the framework's idiom.
  "RUF059",  # Naming an unused element of a returned tuple documents what the helper hands back.
]
