services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_local_only}
      POSTGRES_DB: sih
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d sih"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
